version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: bus_ticket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bus_booking}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./db/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bus_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: bus_ticket_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bus_booking}
      SESSION_SECRET: ${SESSION_SECRET:-bus-ticket-booking-secret-key-2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
